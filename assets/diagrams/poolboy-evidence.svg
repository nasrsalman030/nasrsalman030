<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" role="img" aria-labelledby="title desc">
<title id="title">PoolBoy evidence and reporting</title><desc id="desc">Operational observations, reward records and cost evidence remain separate. Reconciliation produces reports with visible coverage and uncertainty.</desc>
